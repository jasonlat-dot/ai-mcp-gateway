#file: noinspection SpringBootApplicationYaml
server:
  port: 8888
  tomcat:
    threads:
      max: 200        # 设定处理客户请求的线程的最大数目，决定了服务器可以同时响应客户请求的数,默认200
      min-spare: 50   # 初始化线程数,最小空闲线程数,默认是10
    accept-count: 10  # 等待队列长度
  servlet:
    context-path: /api-gateway

  # 应用配置 app.config.api-version
app:
  config:
    # 版本，方便通过接口版本升级
    api-version: v1
    # 跨域，开发阶段可以设置为 * 不限制
    cross-origin: '*'

  # 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

baidu:
  api-key: ${BAIDU_API_KEY}

openai:
  client:
    base-url: ${OPENAI_API_BASE_URL}
    api-key: ${OPENAI_API_KEY}
    model: gpt-5.4
    completions-path: v1/chat/completions
    embeddings-path: v1/embeddings

    http:
      connect-timeout-ms: 10000
      response-timeout-ms: 120000
      connection-request-timeout-ms: 5000
      max-total: 200
      max-per-route: 50
      evict-idle-seconds: 30
      evict-expired-connections: true

      proxy:
        enabled: true
        host: 127.0.0.1
        port: 7890
        username:
        password:

  # mybatis plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #设置sql的日志,有了这句才有打印各种sql的日志在控制台
  mapper-locations: classpath:mybatis/mapper/*.xml

  # 日志
logging:
  level:
    root: info
