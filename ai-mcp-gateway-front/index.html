<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='%2314b8a6'/><stop offset='100%' stop-color='%230d9488'/></linearGradient></defs><path d='M14 2 L26 8.5 V19.5 L14 26 L2 19.5 V8.5 Z' fill='none' stroke='url(%23g)' stroke-width='1.6'/><circle cx='14' cy='14' r='3.4' fill='url(%23g)'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <title>AI MCP Gateway</title>

    <!--
      MCP Gateway · Sub2API-inspired typography stack.
      Inter Variable (400 / 500 / 600 / 700) 作为拉丁/数字主字体;
      Noto Sans SC 作为中文回退(比 Microsoft YaHei 更现代)。
      media="print" + onload 切换为 all,加载不阻塞首屏也不报 404。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <style>
      :root { color-scheme: light; }
      html, body, #app { margin: 0; padding: 0; height: 100%; }
      body {
        background: #f6f8fb;
        color: #0f172a;
        /* 字体堆栈:Inter → Plus Jakarta Sans → 系统字体 → 中文回退 */
        font-family:
          'Inter', 'Plus Jakarta Sans',
          system-ui, -apple-system, BlinkMacSystemFont,
          'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-feature-settings: 'cv11', 'ss01', 'tnum';
        text-rendering: optimizeLegibility;
        line-height: 1.55;
        font-size: 14.5px;
        letter-spacing: -0.005em;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      html.dark { color-scheme: dark; }
      html.dark body { background: #020617; color: #f8fafc; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
